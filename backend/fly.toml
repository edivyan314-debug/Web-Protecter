# fly.toml app configuration file for Web Protector Backend
# Reference: https://fly.io/docs/reference/configuration/

app = "web-protecter-backend"
primary_region = "iad"

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"

[mounts]
  source = "scans_data"
  destination = "/app/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"
